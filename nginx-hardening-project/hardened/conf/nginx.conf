# Hardened nginx.conf — CSCI 7610 independent build
# Starts from Iron Bank's reference/nginx.conf (non-root, pid in /var/cache/nginx,
# ports 8080/8443) and adds the controls listed in Methodology Table 1.
# The container runs as user `nginx`, so the `user` directive is omitted.

worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/cache/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths for a non-root process
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile    on;

    # --- Server header: hide version ------------------------------------------
    server_tokens off;

    # --- Resource limits --------------------------------------------------------
    client_max_body_size        1m;
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    keepalive_timeout           15s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_zone  $binary_remote_addr zone=perreq:10m rate=20r/s;

    # --- TLS: 1.2+ with forward-secret AEAD ciphers -------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Plain HTTP only redirects to HTTPS
    server {
        listen      8080 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen      8443 ssl default_server;
        http2       on;
        server_name _;

        # Certificate is mounted at run time (never baked into the image)
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        # --- Security headers ----------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy           "no-referrer" always;

        limit_conn perip 20;
        limit_req  zone=perreq burst=40 nodelay;

        root      /usr/share/nginx/html;
        index     index.html;
        autoindex off;

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }

        # Block dotfiles (.git, .htaccess, .env)
        location ~ /\. {
            deny all;
        }
    }
}
